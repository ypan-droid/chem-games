<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chem games – connection test</title>
<style>
:root{--bg:#F3F6F9;--card:#fff;--ink:#16222F;--muted:#5B6878;--line:#D2DAE3;--good:#1C8A4C;--bad:#C93A3A;--acc:#0E8C7B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F151C;--card:#18212B;--ink:#E4EBF2;--muted:#94A3B3;--line:#2B3847;--good:#4CC983;--bad:#F27373;--acc:#3CC7B2;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-left,0px)) 40px}
main{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:26px;margin:0}
p{margin:0}
.box{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--acc);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.big{font-size:40px;font-weight:800;color:var(--acc);line-height:1}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.muted{color:var(--muted);font-size:15px}
code{font-size:14px;word-break:break-all}
button{font:inherit;font-weight:700;background:var(--acc);color:var(--card);border:0;border-radius:6px;padding:9px 18px;cursor:pointer;align-self:flex-start}
button.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>网页测试</h1>
  <p class="muted">能看到这一页，说明这个网址没有被挡住。</p>

  <section class="box">
    <b>1. 刷新后能不能记住进度</b>
    <div class="big" id="count">–</div>
    <p id="store"></p>
    <p class="muted">按 F5 刷新几次。数字每次加 1，就说明进度能保存；每次都回到 1，就说明刷新后会丢失。</p>
    <button class="ghost" id="reset" type="button">把数字归零</button>
  </section>

  <section class="box">
    <b>2. 打印证书用的新标签页</b>
    <p id="popmsg" class="muted">点下面的按钮。如果打开了一个新标签页，打印证书就能用。</p>
    <button id="pop" type="button">测试打开新标签页</button>
  </section>

  <section class="box">
    <b>3. 现在的环境</b>
    <p id="env"></p>
    <p class="muted">网址：<code id="url"></code></p>
  </section>
</main>
<script>
const K="chemgames_test_count";
let n=null;
try{n=(parseInt(localStorage.getItem(K),10)||0)+1;localStorage.setItem(K,String(n))}catch(e){}
document.getElementById("count").textContent=n===null?"×":n;
document.getElementById("store").innerHTML=n===null
  ?'<span class="no">浏览器存储不能用。</span>只能靠存档码。'
  :(n>1?'<span class="ok">刷新后记住了（已打开 '+n+' 次）。</span>':'第一次打开。现在刷新一下看看。');
document.getElementById("reset").onclick=()=>{try{localStorage.removeItem(K)}catch(e){}location.reload()};

let framed=false;try{framed=window.top!==window.self}catch(e){framed=true}
document.getElementById("env").innerHTML=framed?'嵌在别的网页里（比如 Google Sites）。':'单独打开（没有嵌入）。';
document.getElementById("url").textContent=location.href;

document.getElementById("pop").onclick=()=>{
  const html='<!doctype html><meta charset="utf-8"><title>Test tab</title><body style="font:20px system-ui;padding:40px"><p>新标签页打开成功。可以关掉这一页。</p></body>';
  let w=null;
  try{const u=URL.createObjectURL(new Blob([html],{type:"text/html"}));w=window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){}
  document.getElementById("popmsg").innerHTML=w?'<span class="ok">新标签页打开了。</span>':'<span class="no">新标签页被挡住了。</span>学生要用截图交证书。';
};
</script>
</body>
</html>
